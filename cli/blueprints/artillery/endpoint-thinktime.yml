config:
  target: "{{ $processEnvironment.TARGET_API_URL }}"
  phases:
    - duration: 300
      arrivalRate: 30
  plugins:
    statsd:
      host: "{{ $processEnvironment.STATSD_HOST }}"
      port: "{{ $processEnvironment.STATSD_PORT }}"
      prefix: "artillery"
scenarios:
  - flow:
      - get:
          url: "/users"
      - think: 2
      - post:
          url: "/login"
          json:
            username: "test"
            password: "1234"
      - think: 3
