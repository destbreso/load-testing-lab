config:
  target: "{{ $processEnvironment.TARGET_API_URL }}"
  phases:
    - duration: 600
      arrivalRate: 20
  plugins:
    statsd:
      host: "{{ $processEnvironment.STATSD_HOST }}"
      port: "{{ $processEnvironment.STATSD_PORT }}"
      prefix: "artillery"
scenarios:
  - flow:
      - get:
          url: "/endpoint"
      - think: "random(0,2)"
