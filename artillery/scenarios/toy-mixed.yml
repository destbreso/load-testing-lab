config:
  target: "{{ $processEnvironment.TARGET_API_URL }}"
  phases:
    - duration: 10
      arrivalRate: 10
    - duration: 30
      arrivalRate: 40
    - duration: 10
      arrivalRate: 5
  
  plugins:
    publish-metrics:
      # Artillery's own metrics, sent over StatsD to Telegraf, which writes them
      # to InfluxDB; flushed before Artillery exits, so the last period arrives too
      - type: statsd
        host: "{{ $processEnvironment.STATSD_HOST }}"
        port: "{{ $processEnvironment.STATSD_PORT }}"
        prefix: "artillery."

scenarios:
  - name: "fast"
    weight: 40
    flow:
      - get:
          url: "/fast"
      - think: 0.5

  - name: "slow"
    weight: 20
    flow:
      - get:
          url: "/slow"
      - think: 0.5

  - name: "users"
    weight: 15
    flow:
      - get:
          url: "/users"
      - think: 0.5

  - name: "cpu"
    weight: 15
    flow:
      - get:
          url: "/cpu"
      - think: 0.5

  - name: "error"
    weight: 10
    flow:
      - get:
          url: "/error"
      - think: 0.5
