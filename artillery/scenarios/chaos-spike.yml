config:
  target: "{{ $processEnvironment.TARGET_API_URL }}"
  phases:
    - duration: 20
      arrivalRate: 5
      name: "Normal load"
    - duration: 30
      arrivalRate: 30
      name: "Spike - Chaos!"
    - duration: 40
      arrivalRate: 30
      name: "Sustained chaos"
    - duration: 30
      arrivalRate: 5
      name: "Recovery"
  plugins:
    publish-metrics:
      # Artillery's own metrics, sent over StatsD to Telegraf, which writes them
      # to InfluxDB; flushed before Artillery exits, so the last period arrives too
      - type: statsd
        host: "{{ $processEnvironment.STATSD_HOST }}"
        port: "{{ $processEnvironment.STATSD_PORT }}"
        prefix: "artillery."
    # Turns the expect blocks below into checks; only failures are printed
    expect:
      outputFormat: prettyError
    # Applies the ensure thresholds below and fails the run when one is missed
    ensure: {}
  ensure:
    maxErrorRate: 60  # Allow 60% errors during chaos
    p99: 5000         # 99th percentile under 5 seconds

scenarios:
  # Scenario names travel over StatsD, which cuts a name at its first space
  - name: "everything-goes-wrong"
    weight: 10
    flow:
      # Hit all problematic endpoints in sequence
      - get:
          url: "/slow"
          expect:
            - statusCode: 200
      
      - think: 0.2
      
      - get:
          url: "/error"
          # May fail - that's expected in chaos
      
      - think: 0.2
      
      - get:
          url: "/cpu"
          expect:
            - statusCode: 200
      
      - think: 0.2
      
      - get:
          url: "/io"
          expect:
            - statusCode: 200
      
      # Longer think time after experiencing chaos
      - think: 3

  - name: "rapid-fire-chaos"
    weight: 5
    flow:
      # Rapid requests to random endpoints
      - loop:
        - get:
            url: "/{{ $randomString() }}"
            # Random URLs - some will 404, simulating user errors
        - think: 0.1
        count: 10
      
      - think: 2
