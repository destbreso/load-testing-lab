config:
  target: "{{ $processEnvironment.TARGET_API_URL }}"
  phases:
    - duration: 15
      arrivalRate: 50
    - duration: 20
      arrivalRate: 120
    - duration: 20
      arrivalRate: 250
  
  plugins:
    publish-metrics:
      # Artillery's own metrics, sent over StatsD to Telegraf, which writes them
      # to InfluxDB; flushed before Artillery exits, so the last period arrives too
      - type: statsd
        host: "{{ $processEnvironment.STATSD_HOST }}"
        port: "{{ $processEnvironment.STATSD_PORT }}"
        prefix: "artillery."

scenarios:
  - name: "fast"
    weight: 30
    flow:
      - get:
          url: "/fast"
      - think: 0.2

  - name: "slow"
    weight: 40
    flow:
      - get:
          url: "/slow"
      - think: 0.2

  - name: "cpu"
    weight: 30
    flow:
      - get:
          url: "/cpu"
      - think: 0.2
