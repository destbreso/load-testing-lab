><text x="352" y="638" fill="#5F6B7A" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="start" dominant-baseline="central">an error is a status other than 200 or a request of 3 s or more</text></svg>
