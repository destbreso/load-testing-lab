<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="100%" role="img" aria-label="One run of the chaos-basic scenario: virtual users ramp to 20 in 30 seconds, hold for a minute and ramp down in 20 seconds; each iteration picks a weighted endpoint; samples flow from k6 to InfluxDB to Grafana; two thresholds decide pass or fail">
  <title>What one run produces</title>
  <desc>Top left, virtual users over time: 0 to 20 in 30 seconds, 20 for one minute, back to 0 in 20 seconds. Top right, the request mix with weights out of 8: fast 3 with no added delay, slow 2 with 500 to 2500 milliseconds of latency, error 2 failing 30 percent of the time, cpu 1 computing ten million square roots. Middle, k6 sends GET requests with a 5 second timeout to the toy API, writes latency, status and bytes to InfluxDB, and Grafana shows percentiles, requests per second and errors. Bottom, the verdict: p95 of request duration under 3000 milliseconds and an error rate under 0.5, where an error is a status other than 200 or a request of 3 seconds or more.</desc>
