l,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">file at /external, read-only</text><rect x="872" y="508" width="56" height="56" rx="6.7" fill="url(#t7AA116)"/><g transform="translate(872 508) scale(1.0000)"><path d="M10 17 H22 L25.5 21 H46 V41 H10 Z" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M10 25 H46" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="900" y="580" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="600">grafana/dashboards/custom</text><text x="900" y="596" fill="#5F6B7A" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">a copy git ignores</text><rect x="1172" y="508" width="56" height="56" rx="6.7" fill="url(#tE7157B)"/><g transform="translate(1172 508) scale(1.0000)"><rect x="10" y="13" width="36" height="30" rx="3" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><rect x="15" y="30" width="4" height="8" fill="#fff"/><rect x="21" y="25" width="4" height="13" fill="#fff"/><path d="M29 35 L33.5 28.5 L37 31 L42 22" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1200" y="580" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="600">Grafana</text><text x="1200" y="596" fill="#5F6B7A" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">folder custom</text><rect x="1172" y="228" width="56" height="56" rx="6.7" fill="url(#t3B48CC)"/><g transform="translate(1172 228) scale(1.0000)"><ellipse cx="28" cy="17" rx="13" ry="5" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 17 V39 A13 5 0 0 0 41 39 V17" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 28 A13 5 0 0 0 41 28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1200" y="300" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="13" text-anchor="middle" dominant-baseline="central" font-weight="600">InfluxDB</text><text x="1200" y="316" fill="#5F6B7A" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11" text-anchor="middle" dominant-baseline="central">one history for every repo</text><circle cx="250" cy="154" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="154.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">1</text><circle cx="250" cy="344" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="344.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">2</text><circle cx="250" cy="534" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="250" y="534.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">3</text><rect x="24" y="650" width="1312" height="108" rx="6" fill="#F7F8FA" stroke="#D5DBDB"/><text x="42" y="670" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="12.5" text-anchor="start" dominant-baseline="central" font-weight="700">Commands</text><circle cx="52" cy="699" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="52" y="699.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">1</text><text x="70" y="699" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">-p mounts a whole folder read-only at /project, so a scenario</text><text x="70" y="715" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">can import helpers and read data files.</text><circle cx="477.3" cy="699" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="477.3" y="699.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">2</text><text x="495.3" y="699" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">-s with a local path mounts that file's folder read-only at</text><text x="495.3" y="715" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">/external; a bare name runs a built-in scenario.</text><circle cx="902.7" cy="699" r="10.5" fill="#232F3E" stroke="#FFFFFF" stroke-width="2"/><text x="902.7" y="699.5" fill="#FFFFFF" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="middle" dominant-baseline="central" font-weight="700">3</text><text x="920.7" y="699" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">dashboard link copies the JSON into grafana/dashboards/custom,</text><text x="920.7" y="715" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">which git ignores; Grafana picks it up within 10 seconds, and</text><text x="920.7" y="731" fill="#232F3E" font-family="'Segoe UI',-apple-system,system-ui,'Helvetica Neue',Arial,sans-serif" font-size="11.5" text-anchor="start" dominant-baseline="central">relinking syncs it.</text></svg>
