<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 782" width="100%" role="img" aria-label="External projects: three example repositories keep their own scenarios and dashboards; the lab mounts scenario folders and files read-only into k6 and Artillery and copies dashboards into a git-ignored folder that Grafana loads">
  <title>Scenarios and dashboards stay in your repositories</title>
  <desc>Left, three example repositories: payment-api with a load-tests folder, search-service with one scenario file, mobile-backend with Grafana dashboards. Right, the lab's Docker host. Dashed arrows labeled with the commands: ltlab k6 -p mounts the folder read-only at /project in the k6 container; ltlab artillery -s mounts the file's folder read-only at /external in the Artillery container; ltlab dashboard link copies the JSON into grafana/dashboards/custom, which Grafana picks up within 10 seconds. Both generators write to one InfluxDB, Artillery through Telegraf.</desc>
