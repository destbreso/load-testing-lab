networks:
  ltl-net:
    driver: bridge

services:
  influxdb:
    image: influxdb:2.6
    ports:
      - "${INFLUXDB_PORT_EXPORT:-8086}:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=${INFLUXDB_USER:-admin}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${INFLUXDB_PASSWORD:-admin123}
      - DOCKER_INFLUXDB_INIT_ORG=${INFLUXDB_ORG:-myorg}
      - DOCKER_INFLUXDB_INIT_BUCKET=${INFLUXDB_BUCKET:-loadtests}
      # On its first start, InfluxDB adopts the token in .env as its admin
      # token, so k6, Telegraf and Grafana all use that same value
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s
    networks:
      - ltl-net

  grafana:
    image: grafana/grafana:10.1.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin123}
      # Read by the provisioned InfluxDB datasource
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-myorg}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-loadtests}
    depends_on:
      influxdb:
        condition: service_healthy
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 24
    networks:
      - ltl-net

  telegraf:
    image: telegraf:1.28-alpine
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    ports:
      - "8125:8125/udp" # StatsD
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - INFLUXDB_URL=http://influxdb:8086
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-myorg}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-loadtests}
    restart: unless-stopped
    networks:
      - ltl-net

  # The load generators start only for a test (ltlab k6, ltlab artillery or
  # `docker compose run`), never with `up`
  k6:
    build: ./k6
    profiles: ["runners"]
    working_dir: /k6
    volumes:
      - ./k6:/k6
    environment:
      - TARGET_API_URL=${TARGET_API_URL}
      - CONCURRENCY=${CONCURRENCY}
      - DURATION=${DURATION}
      - INFLUXDB_TOKEN=${INFLUXDB_TOKEN}
      - INFLUXDB_ORG=${INFLUXDB_ORG:-myorg}
      - INFLUXDB_BUCKET=${INFLUXDB_BUCKET:-loadtests}
    # host.docker.internal reaches an API running on your machine, Linux included
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      influxdb:
        condition: service_healthy
    networks:
      - ltl-net

  artillery:
    build: ./artillery
    profiles: ["runners"]
    working_dir: /artillery
    volumes:
      - ./artillery:/artillery
    environment:
      - TARGET_API_URL=${TARGET_API_URL}
      - CONCURRENCY=${CONCURRENCY}
      - DURATION=${DURATION}
      # Telegraf StatsD configuration
      - STATSD_HOST=telegraf
      - STATSD_PORT=8125
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      influxdb:
        condition: service_healthy
      telegraf:
        condition: service_started
    networks:
      - ltl-net

  toy-api:
    build: ./toy-api
    ports:
      - "${TOY_API_PORT:-5000}:5000"
    environment:
      - PORT=5000
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - ltl-net

volumes:
  influxdb-data:
