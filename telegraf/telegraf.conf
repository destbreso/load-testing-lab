# Telegraf Configuration
# Bridge entre Artillery (StatsD) y InfluxDB v2

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  hostname = "telegraf"
  omit_hostname = false

# Input: StatsD (recibe métricas de Artillery)
[[inputs.statsd]]
  # Gauges are collected every second: Artillery reports every 10 seconds, and
  # two reports inside one collection would keep only the second one
  interval = "1s"
  protocol = "udp"
  service_address = ":8125"
  delete_gauges = true
  delete_counters = true
  delete_sets = true
  delete_timings = true
  metric_separator = "_"
  parse_data_dog_tags = false
  datadog_extensions = false
  allowed_pending_messages = 10000

  # Artillery's per-endpoint metrics would create one series per URL, without
  # bound for URLs that carry IDs, so they are not stored
  namedrop = ["artillery_plugins"]
  
  # Artillery's publish-metrics plugin sends its metrics with the prefix
  # "artillery.": counters (artillery.http.requests, artillery.http.codes.200,
  # artillery.vusers.created) and, for each 10-second period, the statistics of
  # its summaries (artillery.http.response_time.p95, also split by status class
  # as artillery.http.response_time.2xx.p95). The templates below make the last
  # part the field, so http.response_time.p95 is field p95 of measurement
  # artillery_http_response_time, and http.requests is field http_requests of
  # measurement artillery.
  templates = [
    "artillery.http.response_time.*.* measurement.measurement.measurement.class.field",
    "artillery.http.response_time.* measurement.measurement.measurement.field",
    "artillery.vusers.session_length.* measurement.measurement.measurement.field",
    "artillery.http.codes.* measurement.measurement.measurement.field",
    "artillery.vusers.created_by_name.* measurement.measurement.measurement.field*",
    "artillery.errors.* measurement.measurement.field*",
    "artillery.plugins.* measurement.measurement.field*",
    "artillery.* measurement.field*"
  ]

# Output: InfluxDB v2
[[outputs.influxdb_v2]]
  urls = ["${INFLUXDB_URL}"]
  token = "${INFLUXDB_TOKEN}"
  organization = "${INFLUXDB_ORG}"
  bucket = "${INFLUXDB_BUCKET}"
  timeout = "5s"
  user_agent = "telegraf-artillery"
  
  # Etiquetas adicionales para identificar datos de Artillery
  [outputs.influxdb_v2.tagpass]
  
  [outputs.influxdb_v2.tagdrop]
